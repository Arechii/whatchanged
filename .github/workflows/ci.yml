name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test

  smoke:
    name: Pack and run (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # The tarball installed into an empty project, so a runtime import of
      # anything left out of the bundle fails here rather than for a user.
      - name: Install the packed tarball
        shell: bash
        run: |
          # RUNNER_TEMP is a backslashed path on Windows, so no glob on it.
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP/$tarball"
          npx whatchanged --version
          npx whatchanged --help

      # Real pnpm, npm registry and GitHub: on Windows this is what proves
      # the pnpm shim starts.
      - name: Read a fixture workspace
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm install --dir test/e2e --frozen-lockfile
          cd "$RUNNER_TEMP/smoke"
          npx whatchanged --cwd "$GITHUB_WORKSPACE/test/e2e" > notes.md
          cat notes.md
          grep -q "^## semver 7.6.0 → " notes.md
          grep -q "^### v7.6.1$" notes.md
          grep -q "^## ms 2.1.2 → 2.1.3 (patch)$" notes.md
